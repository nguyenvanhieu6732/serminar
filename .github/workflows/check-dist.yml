name: Check dist

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-dist:
    name: Check bundled output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run package

      - name: Verify dist freshness
        run: git diff --exit-code -- dist/index.js
